<title>RALLY 11 — FLICK ARENA</title>
<style>

<body>
<main class="app" id="app">
  <header class="topbar"><div class="logo">RALLY<b>11</b><span>FLICK ARENA · V4</span></div><div class="iconBtns"><button type="button" class="iconBtn" id="soundBtn" aria-label="音のオンオフ">♪</button><button type="button" class="iconBtn" id="pauseBtn" aria-label="一時停止">Ⅱ</button></div></header>
  <section class="scorebar" aria-label="スコア"><div class="scoreCard you"><div><div class="playerName">YOU</div><div class="setDots" id="yourSets"><i></i><i></i></div></div><div class="points" id="yourScore">0</div></div><div class="middleScore"><strong id="gameNum">GAME 1</strong><small id="serveLabel">11 POINTS</small></div><div class="scoreCard cpu"><div class="points" id="cpuScore">0</div><div><div class="playerName">CPU</div><div class="setDots" id="cpuSets"><i></i><i></i></div></div></div></section>
  <section class="stage" aria-label="卓球コート"><canvas id="court"></canvas><div class="stageTop"><div class="modePill" id="difficultyPill">LEVEL / NORMAL</div><div class="rallyPill">RALLY <b id="rallyCount">0</b></div></div><div class="banner hidden" id="banner"></div><div class="hint" id="hint">指でラケットを動かしてボールを打ち返そう</div></section>
  <div class="motionBar" aria-live="polite">
    <div class="motionGuide"><span class="motionGlyph">↕</span><div><strong>指で直接スイング</strong><small>フリック方向へ返球　上下：距離と回転</small></div></div>
    <div class="motionResult"><span class="motionState" id="spinLabel">フラット</span><strong id="spinPower">—</strong></div>
  </div>
  <div class="footer">上下左右にフリックして打つ ／ 低い視点・広いコート ／ カコンと響く打球音</div>
  <div class="overlay" id="overlay" role="dialog" aria-modal="true"><div class="modal" id="modal"></div></div>
</main>
<script>
'use strict';
(()=>{
const $=id=>document.getElementById(id), cvs=$('court'), ctx=cvs.getContext('2d'), overlay=$('overlay'), modal=$('modal');
const scoreYou=$('yourScore'),scoreCpu=$('cpuScore'),gameNum=$('gameNum'),serveLabel=$('serveLabel'),banner=$('banner'),hint=$('hint');
const TAU=Math.PI*2,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),mix=(a,b,t)=>a+(b-a)*t,rand=(a,b)=>a+Math.random()*(b-a);
const levels={easy:{name:'EASY',cpuSpeed:1.55,accuracy:.43,returnDur:1.00,reach:.44,aim:.48},normal:{name:'NORMAL',cpuSpeed:1.98,accuracy:.22,returnDur:.83,reach:.46,aim:.62},hard:{name:'PRO',cpuSpeed:2.60,accuracy:.08,returnDur:.71,reach:.48,aim:.83}};
let difficulty='normal',settings=levels.normal,W=390,H=530,dpr=1,gameState='menu',wasPaused='ready',points={you:0,cpu:0},sets={you:0,cpu:0},gameIndex=1,serve='you',rally=0,best=0,totalHits=0,aiAngle=18,muted=false,audio=null,shot=null,ball={x:0,z:.9,y:.18},trail=[],particles=[],aiX=0,playerX=0,targetPlayerX=0,playerY=.18,targetPlayerY=.18,playerVel=0,strokeX=0,strokeY=0,lastStroke=0,spinReadout=0,pointerDown=false,pointerId=null,keyDir=0,keyVert=0,pointTime=0,pointMessage='',pointSub='',elapsed=0,aiServeTimer=0,last=0,glowPulse=0,flyaway=null,followCam={x:0,y:0,zoom:1},gestureSamples=[],flickVector=null;
// ラケットの実際の移動速度を衝突時にサンプリングする。
function swingSpin(vx,vy){return {top:clamp(vy*.31,-1,1),side:clamp(vx*.19,-.86,.86),power:clamp(Math.hypot(vx*.16,vy*.19),0,1)};}
// 最新130msの指の移動からフリック方向を求め、打球時まで短時間保持する。
function recordFlick(e){
 const now=performance.now(),r=cvs.getBoundingClientRect();
 gestureSamples.push({x:e.clientX-r.left,y:e.clientY-r.top,t:now});
 while(gestureSamples.length>2&&now-gestureSamples[0].t>130)gestureSamples.shift();
 if(gestureSamples.length<2)return;
 const first=gestureSamples[0],last=gestureSamples[gestureSamples.length-1];
 const dt=Math.max(.016,(last.t-first.t)/1000);
 const vx=(last.x-first.x)/dt,vy=(last.y-first.y)/dt;
 if(Math.hypot(vx,vy)<135||Math.hypot(last.x-first.x,last.y-first.y)<9)return;
 const side=clamp(vx/(W*1.35),-1,1),depth=clamp(-vy/(H*1.10),-1,1);
 flickVector={side,depth,power:clamp(Math.hypot(side,depth),.12,1),at:now};
}
function recentFlick(){return flickVector&&performance.now()-flickVector.at<850?flickVector:null;}
function updateSpinReadout(top=0,side=0){const strength=Math.max(Math.abs(top),Math.abs(side));$('spinLabel').textContent=strength<.14?'フラット':Math.abs(side)>Math.abs(top)*1.25?'横回転':top>0?'トップスピン':'バックスピン';$('spinPower').textContent=strength<.14?'—':`${Math.round(strength*100)}%`;}

try{best=Number(localStorage.getItem('rally11_best')||0)}catch{}
function sound(freq=300,dur=.05,type='sine',gain=.07){if(muted)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;audio=audio||new C();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(50,freq*.62),audio.currentTime+dur);g.gain.setValueAtTime(gain,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch{}}
// 短い高域のアタック＋空洞の共鳴を重ねた、木製ラケット風の「カコン」。
function woodKnock(kind='racket',intensity=1){
 if(muted)return;
 try{
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  audio=audio||new C();if(audio.state==='suspended')audio.resume();
  const now=audio.currentTime,volume=Math.max(.2,Math.min(1.3,intensity));
  const racket=kind==='racket',base=racket?355:255;
  const noiseLength=Math.floor(audio.sampleRate*.065),buf=audio.createBuffer(1,noiseLength,audio.sampleRate);
  const pcm=buf.getChannelData(0);for(let i=0;i<noiseLength;i++)pcm[i]=Math.random()*2-1;
  const n=audio.createBufferSource();n.buffer=buf;
  const filter=audio.createBiquadFilter();filter.type='bandpass';filter.frequency.value=racket?1550:980;filter.Q.value=.8;
  const ng=audio.createGain();ng.gain.setValueAtTime(.0001,now);ng.gain.linearRampToValueAtTime(.08*volume,now+.001);
  ng.gain.exponentialRampToValueAtTime(.0001,now+(racket?.050:.060));
  n.connect(filter);filter.connect(ng);ng.connect(audio.destination);n.start(now);n.stop(now+.067);
  for(const [freq,amp,decay] of [[base,.115,.085],[base*1.93,.040,.043]]){
   const osc=audio.createOscillator(),gain=audio.createGain();osc.type='sine';
   osc.frequency.setValueAtTime(freq,now);osc.frequency.exponentialRampToValueAtTime(freq*.77,now+decay);
   gain.gain.setValueAtTime(.0001,now);gain.gain.linearRampToValueAtTime(amp*volume,now+.002);
   gain.gain.exponentialRampToValueAtTime(.0001,now+decay);
   osc.connect(gain);gain.connect(audio.destination);osc.start(now);osc.stop(now+decay+.004);
  }
 }catch{}
}
function resize(){const b=cvs.getBoundingClientRect();W=Math.max(1,b.width);H=Math.max(1,b.height);dpr=Math.min(2,window.devicePixelRatio||1);cvs.width=Math.round(W*dpr);cvs.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
window.addEventListener('resize',resize);
const scoreText=()=>{scoreYou.textContent=points.you;scoreCpu.textContent=points.cpu;gameNum.textContent=`GAME ${gameIndex}`;serveLabel.textContent=serve==='you'?'● YOU SERVE':'● CPU SERVE';$('rallyCount').textContent=rally;for(const [elName,n,color] of [['yourSets',sets.you,'you'],['cpuSets',sets.cpu,'cpu']]){$(elName).querySelectorAll('i').forEach((el,i)=>{el.className=i<n?'active '+color:''})}};
function getServer(){const total=points.you+points.cpu;const change=points.you>=10&&points.cpu>=10?total-20+10:Math.floor(total/2);return (Math.max(0,change)+gameIndex-1)%2===0?'you':'cpu'}
function showBanner(t,sub=''){banner.innerHTML='';banner.textContent=t;if(sub){const s=document.createElement('small');s.textContent=sub;banner.append(s)}banner.classList.remove('hidden')}

function launch(from,startX,style='drive'){

 let landing;
 if(from==='you'){
   // 左右フリックの方向がそのまま着地点になる。斜め方向も反映する。
   // フリックが無ければ中央寄りの安定したショットを打ち、ラリーを続けやすくする。
   landing=flick?clamp(flick.side*.91-aiX*.10+rand(-.025,.025),-1.12,1.12)
     :clamp(-aiX*.38+side*.31+rand(-.055,.055),-.91,.91);
 }else{
   let sideAim=Math.random()<.5?-1:1;
   if(Math.random()<.62)sideAim=playerX>.18?-1:playerX<-.18?1:sideAim;
   landing=clamp(sideAim*rand(.31,settings.aim)+rand(-.11,.11),-.94,.94);
 }

 const bounceT=clamp(.71-top*.075,.62,.80);
 const depth=from==='you'?(flick?flick.depth:clamp(strokeY*.19,-1,1)):0;
 const toZ=from==='you'?-clamp(.81+depth*.13,.65,.96):.88;
 shot={from,to,startX,landing,t:0,dur,top,side,spinValue:top,curve,bounceT,bounced:false,
   fromZ:from==='you'?.91:-.91,toZ};
 if(from==='you')flickVector=null;
 hideBanner();gameState='rally';rally++;totalHits++;scoreText();
 woodKnock('racket',from==='you'?1.05:.93);
 if(from==='you'){

function ballPos(s){

 // 横回転は飛行中に曲がる。飛ぶ距離に応じて偏差を増加させる。
 const x=mix(s.startX,s.landing,t)+Math.sin(Math.PI*t)*s.curve;
 let y;
 if(t<=b){const height=.41-s.top*.17;y=.16*(1-u)+height*4*u*(1-u)}

function finishShot(){

   const miss=Math.abs(playerX-s.landing);

   const reach=difficulty==='easy'?.64:difficulty==='normal'?.56:.50;

function loop(now){let dt=Math.min((now-last)/1000||.016,.05);last=now;if(gameState!=='paused'&&gameState!=='menu'&&gameState!=='gameover')simulate(dt);drawScene();requestAnimationFrame(loop)}
function setAim(evt){
 const rect=cvs.getBoundingClientRect();
 const x=evt.clientX-rect.left,y=evt.clientY-rect.top;
 targetPlayerX=clamp((x-W/2)/(W*.49),-.97,.97);
 // 指の上下座標をラケットの高さに変換。指を素早く振るほど球の回転が強い。
 targetPlayerY=clamp((H*.90-y)/(H*.62),.04,.60);
}
cvs.addEventListener('pointerdown',e=>{
 e.preventDefault();if(pointerDown)return;
 pointerDown=true;pointerId=e.pointerId;gestureSamples=[];
 cvs.setPointerCapture(e.pointerId);setAim(e);recordFlick(e);
 // iOS Safariのオーディオ制限を解除するため、ユーザー操作時に音源を準備。
 if(!muted&&audio?.state==='suspended')audio.resume().catch(()=>{});
});
cvs.addEventListener('pointermove',e=>{
 if(pointerDown&&e.pointerId===pointerId){e.preventDefault();setAim(e);recordFlick(e)}
});
function releasePointer(e){
 if(e.pointerId!==pointerId)return;
 if(e.type==='pointerup'&&gameState==='ready'&&serve==='you'){
   // サーブは指を離してから。フリック方向をそのまま最初の打球に反映する。
   launch('you',playerX);
 }
 pointerDown=false;pointerId=null;gestureSamples=[];
}
cvs.addEventListener('pointerup',releasePointer);cvs.addEventListener('pointercancel',releasePointer);
window.addEventListener('keydown',e=>{
 if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','a','d','w','s','A','D','W','S'].includes(e.key))e.preventDefault();
 if(['ArrowLeft','a','A'].includes(e.key))keyDir=-1;
 if(['ArrowRight','d','D'].includes(e.key))keyDir=1;
 if(['ArrowUp','w','W'].includes(e.key))keyVert=1;
 if(['ArrowDown','s','S'].includes(e.key))keyVert=-1;
 if(e.key===' '&&gameState==='ready'&&serve==='you')launch('you',playerX);
 if(e.key==='Escape'&&['ready','rally','point','chase'].includes(gameState))pause();
});
window.addEventListener('keyup',e=>{
 if(['ArrowLeft','ArrowRight','a','d','A','D'].includes(e.key))keyDir=0;
 if(['ArrowUp','ArrowDown','w','s','W','S'].includes(e.key))keyVert=0;
});
$('soundBtn').addEventListener('click',()=>{muted=!muted;$('soundBtn').textContent=muted?'♪̸':'♪';$('soundBtn').setAttribute('aria-label',muted?'音をオン':'音をオフ')});
function pause(){if(!['ready','rally','point','chase'].includes(gameState))return;wasPaused=gameState;gameState='paused';overlay.hidden=false;$('pauseBtn').textContent='▶';modal.innerHTML=`<div class="trophy">⏸</div><div class="eyebrow">BREAK TIME</div><h1>PAUSED</h1><p>試合を一時停止中です。</p><button class="primary" id="resumeBtn">試合にもどる　▶</button><button class="secondary" id="quitBtn">タイトルへ戻る</button>`;$('resumeBtn').addEventListener('click',resume);$('quitBtn').addEventListener('click',()=>showMenu())}
function resume(){overlay.hidden=true;gameState=wasPaused;$('pauseBtn').textContent='Ⅱ'}
$('pauseBtn').addEventListener('click',()=>{if(gameState==='paused')resume();else if(gameState==='menu'||gameState==='gameover'){}else pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&['ready','rally','point','chase'].includes(gameState))pause()});
resize();scoreText();updateSpinReadout();showMenu();requestAnimationFrame(loop);
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
})();
</script>
</body>
